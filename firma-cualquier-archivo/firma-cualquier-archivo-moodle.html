<script>
if (new URLSearchParams(window.location.search).get('standalone') === '1') {
  document.addEventListener('DOMContentLoaded', () => {
    const bootstrapLink = document.createElement('link');
    bootstrapLink.rel = 'stylesheet';
    bootstrapLink.href = 'https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css';
    document.head.appendChild(bootstrapLink);
    const viewportMeta = document.createElement('meta');
    viewportMeta.name = 'viewport';
    viewportMeta.content = 'width=device-width, initial-scale=1';
    document.head.appendChild(viewportMeta);
    document.body.classList.add('container', 'py-4');
    document.title = 'Firma de cualquier archivo';
  });
}
</script>
<div class="firma-archivos">
  <div class="form-group">
    <label class="d-block" for="files">Selecciona los archivos para firmar</label>
    <input type="file" id="files" class="form-control-file" accept=".pdf,application/pdf" multiple>
  </div>
  <p class="form-text text-muted">Los archivos deben estar en formato PDF y la zona de firma debe ser la misma en todos los documentos.</p>
  <div id="actionBar">
    <button id="sign" class="btn btn-primary" disabled>Firmar y descargar</button>
    <span id="status" class="ml-2 ms-2" role="status" aria-live="polite"></span>
  </div>
</div>

<div id="previewBackdrop" class="modal-backdrop fade" aria-hidden="true" hidden></div>
<div id="previewDialog" class="modal moodle-has-zindex" role="dialog" aria-modal="true"
     aria-labelledby="previewTitle" tabindex="-1" style="z-index: 1052;" hidden>
  <div class="modal-dialog modal-lg" tabindex="-1">
    <div id="dialogContent" class="modal-content">
      <div class="modal-header">
        <h2 id="previewTitle" class="modal-title h5">Configurar la firma</h2>
      </div>
      <div class="modal-body">
        <div id="documentWarning" class="alert alert-warning" role="alert" hidden></div>
        <div id="signatureFieldControl" class="form-group" hidden>
          <label for="signatureField">Ubicación de la firma</label>
          <select id="signatureField" class="custom-select form-select">
            <option value="manual">Elegir región manualmente</option>
          </select>
        </div>
        <div id="manualControls">
          <div id="previewControls" class="d-flex align-items-center flex-wrap mb-2">
            <label for="pageNumber" class="mb-0 mr-2 me-2">Página</label>
            <input id="pageNumber" type="number" min="1" value="1" class="form-control form-control-sm w-auto">
            <span id="pageCount" class="ml-2 ms-2 text-muted"></span>
          </div>
          <p class="form-text text-muted mt-0 mb-2">Selecciona con el ratón o el dedo la zona donde se colocará la firma.</p>
          <div id="previewContainer">
            <canvas id="previewCanvas"></canvas>
            <canvas id="selectionCanvas" aria-label="Selecciona la región de firma"></canvas>
          </div>
          <p id="regionStatus" class="form-text text-muted mb-0" role="status" aria-live="polite">Aún no has seleccionado una región.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button id="cancelPreview" class="btn btn-secondary" type="button">Cancelar</button>
        <button id="confirmSign" class="btn btn-primary" type="button" disabled>Firmar y descargar</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/ctt-gob-es/clienteafirma@master/afirma-ui-miniapplet-deploy/src/main/webapp/js/autoscript.js"
        onerror="var s=document.createElement('script');s.src='autoscript.js';document.head.appendChild(s);"></script>
<script>
  const $ = id => document.getElementById(id);
  const filesInput = $('files');
  const signButton = $('sign');
  const status = $('status');

  function setStatus(message, isError = false) {
    status.textContent = message;
    status.className = 'ml-2 ms-2' + (isError ? ' text-danger' : '');
  }

  function sanitizeFilename(name) {
    const safeName = String(name || 'archivo')
      .normalize('NFC')
      .replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_')
      .replace(/[. ]+$/g, '');
    return safeName || 'archivo';
  }

  function uniquePdfName(fileName, usedNames) {
    const baseName = sanitizeFilename(fileName).replace(/\.pdf$/i, '') || 'archivo';
    let signedName = `${baseName}_firmado.pdf`;
    let suffix = 2;
    while (usedNames.has(signedName.toLocaleLowerCase('es'))) {
      signedName = `${baseName}_firmado_${suffix++}.pdf`;
    }
    usedNames.add(signedName.toLocaleLowerCase('es'));
    return signedName;
  }

  function uint8ArrayToBase64(bytes) {
    let binary = '';
    const chunkSize = 0x8000;
    for (let offset = 0; offset < bytes.length; offset += chunkSize) {
      binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
    }
    return btoa(binary);
  }

  function base64ToUint8Array(base64) {
    const binary = atob(base64.replace(/\s+/g, ''));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  function downloadBlob(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function firmarPdf(base64Data, params) {
    return new Promise((resolve, reject) => {
      try {
        AutoScript.sign(
          base64Data,
          'SHA256withRSA',
          'PAdES',
          params,
          (signatureB64) => resolve(signatureB64),
          (type, message, code) => reject(new Error(`${message || 'fallo al firmar'}${code ? ' [' + code + ']' : ''} (${type || 'Error'})`))
        );
      } catch(e){
        let t = '', m = '';
        try { t = AutoScript.getErrorType(); m = AutoScript.getErrorMessage(); } catch(_){}
        console.error('Excepción en AutoScript.sign:', e, '| tipo:', t, '| mensaje:', m);
        const det = (e && e.message && e.message !== 'Error') ? e.message : String(e);
        reject(new Error(`Excepción al firmar: ${det}` + (t || m ? ` [${t}] ${m}` : '')));
      }
    });
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

  const previewDialog = $('previewDialog');
  const previewBackdrop = $('previewBackdrop');
  const modalDialog = previewDialog.querySelector('.modal-dialog');
  const documentWarning = $('documentWarning');
  const signatureFieldControl = $('signatureFieldControl');
  const signatureFieldSelect = $('signatureField');
  const manualControls = $('manualControls');
  const pageNumberInput = $('pageNumber');
  const pageCount = $('pageCount');
  const previewCanvas = $('previewCanvas');
  const selectionCanvas = $('selectionCanvas');
  const regionStatus = $('regionStatus');
  const confirmSignButton = $('confirmSign');
  const previewContainer = $('previewContainer');
  const dialogContent = $('dialogContent');
  const modalBody = dialogContent.querySelector('.modal-body');
  let previouslyFocusedElement = null;

  function openPreviewDialog() {
    previouslyFocusedElement = document.activeElement;
    previewBackdrop.hidden = false;
    previewBackdrop.classList.add('show');
    previewDialog.hidden = false;
    previewDialog.classList.add('show');
    document.body.classList.add('modal-open');
    $('cancelPreview').focus();
  }

  function closePreviewDialog() {
    previewDialog.classList.remove('show');
    previewBackdrop.classList.remove('show');
    previewDialog.hidden = true;
    previewBackdrop.hidden = true;
    document.body.classList.remove('modal-open');
    if (previouslyFocusedElement instanceof HTMLElement && previouslyFocusedElement.isConnected) {
      previouslyFocusedElement.focus();
    }
    previouslyFocusedElement = null;
  }

  function cancelPreview() {
    closePreviewDialog();
    disposePreview();
    filesInput.disabled = false;
    signButton.disabled = filesInput.files.length === 0;
    setStatus('Firma cancelada.');
  }

  previewDialog.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      event.preventDefault();
      cancelPreview();
      return;
    }
    if (event.key !== 'Tab') return;
    const focusable = Array.from(previewDialog.querySelectorAll(
      'button:not([disabled]), input:not([disabled]), select:not([disabled]), [href], [tabindex]:not([tabindex="-1"])'
    )).filter(element => element.getClientRects().length > 0);
    if (!focusable.length) {
      event.preventDefault();
      previewDialog.focus();
      return;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && (document.activeElement === first || document.activeElement === previewDialog)) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });
  previewDialog.addEventListener('click', event => {
    if (event.target === previewDialog) cancelPreview();
  });

  let pdfs = [];
  let previewDocument = null;
  let previewViewport = null;
  let currentPage = 1;
  let selectedRegion = null;
  let drawingRegion = null;

  function disposePreview() {
    if (previewDocument) previewDocument.destroy();
    previewDocument = null;
    pdfs = [];
    selectedRegion = null;
    drawingRegion = null;
    previewViewport = null;
    previewCanvas.width = 0;
    previewCanvas.height = 0;
    selectionCanvas.width = 0;
    selectionCanvas.height = 0;
  }

  function getPageLayout(page) {
    return { view: Array.from(page.view), rotation: page.rotate || 0 };
  }

  async function inspectPdf(file, bytes, keepDocument = false) {
    const document = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    const layout = [];
    const fields = [];
    try {
      for (let number = 1; number <= document.numPages; number++) {
        const page = await document.getPage(number);
        layout.push(getPageLayout(page));
        const annotations = await page.getAnnotations();
        for (const annotation of annotations) {
          if (annotation.subtype === 'Widget' &&
              (annotation.fieldType === 'Sig' || annotation.isSignature) &&
              !annotation.fieldValue && annotation.fieldName) {
            fields.push({ name: annotation.fieldName, page: number });
          }
        }
        page.cleanup();
      }
    } catch (error) {
      document.destroy();
      throw error;
    }
    if (!keepDocument) document.destroy();
    return { file, bytes, layout, fields, document: keepDocument ? document : null };
  }

  function layoutsMatch(first, other) {
    if (!first || !other || first.length !== other.length) return false;
    return first.every((page, index) => {
      const candidate = other[index];
      return page.rotation === candidate.rotation &&
        page.view.every((coordinate, position) => Math.abs(coordinate - candidate.view[position]) < 0.5);
    });
  }

  function hasDifferentDocuments() {
    return pdfs.length > 1 && pdfs.some(pdf => !layoutsMatch(pdfs[0].layout, pdf.layout));
  }

  function updateConfirmButton() {
    confirmSignButton.disabled = signatureFieldSelect.value === 'manual' && !selectedRegion;
  }

  function themeColor() {
    const styles = getComputedStyle(document.documentElement);
    const value = (styles.getPropertyValue('--bs-primary') || styles.getPropertyValue('--primary') || '').trim();
    return /^#[0-9a-f]{3,8}$/i.test(value) ? value : '#0f6cbf';
  }

  function drawSelection() {
    const context = selectionCanvas.getContext('2d');
    context.clearRect(0, 0, selectionCanvas.width, selectionCanvas.height);
    const cssWidth = selectionCanvas.clientWidth;
    if (!cssWidth || !selectionCanvas.width) return;
    const k = selectionCanvas.width / cssWidth;           // píxeles del bitmap por píxel CSS
    context.strokeStyle = '#767676';
    context.lineWidth = k;
    context.strokeRect(k / 2, k / 2, selectionCanvas.width - k, selectionCanvas.height - k);
    const region = drawingRegion || selectedRegion;
    if (!region || region.page !== currentPage || !previewViewport) return;
    const { left, top, right, bottom } = region.viewportRect;
    const color = themeColor();
    context.save();
    context.globalAlpha = 0.16;
    context.fillStyle = color;
    context.fillRect(left, top, right - left, bottom - top);
    context.restore();
    context.strokeStyle = color;
    context.lineWidth = 2 * k;
    context.strokeRect(left, top, right - left, bottom - top);
  }

  // Coloca las dos capas (página y selección) con tamaño y posición explícitos,
  // ajustadas al espacio disponible. No depende de flex, % ni de reglas del tema.
  function fitPreview() {
    if (!previewViewport) return;
    const availableWidth = previewContainer.clientWidth;
    const availableHeight = previewContainer.clientHeight;
    if (!availableWidth || !availableHeight) return;
    const scale = Math.min(availableWidth / previewViewport.width, availableHeight / previewViewport.height);
    const width = Math.max(1, Math.floor(previewViewport.width * scale));
    const height = Math.max(1, Math.floor(previewViewport.height * scale));
    const left = Math.floor((availableWidth - width) / 2);
    const top = Math.floor((availableHeight - height) / 2);
    for (const canvas of [previewCanvas, selectionCanvas]) {
      Object.assign(canvas.style, {
        position: 'absolute', left: `${left}px`, top: `${top}px`, width: `${width}px`, height: `${height}px`,
        margin: '0', maxWidth: 'none', maxHeight: 'none', transform: 'none', display: 'block',
      });
    }
    selectionCanvas.style.touchAction = 'none';
    selectionCanvas.style.cursor = 'crosshair';
  }

  // Dimensiona el diálogo y reparte el espacio vertical que sobra a la vista previa.
  const MIN_PREVIEW_HEIGHT = 100;
  function relayout() {
    if (!previewDialog.classList.contains('show')) return;
    const maxHeight = Math.max(160, window.innerHeight - 16);
    modalDialog.style.width = `${Math.max(240, Math.min(window.innerWidth - 16, 760))}px`;
    modalDialog.style.maxHeight = `${maxHeight}px`;
    modalDialog.style.margin = '0.5rem auto';
    Object.assign(dialogContent.style, {
      display: 'flex',
      flexDirection: 'column',
      minHeight: '0',
      maxHeight: '100%',
    });
    if (manualControls.hidden) {
      // Solo se elige un campo de firma: el diálogo se ajusta a su contenido.
      modalDialog.style.height = 'auto';
      dialogContent.style.height = 'auto';
      Object.assign(modalBody.style, {
        display: 'block',
        flex: '0 1 auto',
        flexDirection: '',
        minHeight: '',
        overflowY: 'auto',
      });
    } else {
      modalDialog.style.height = `${Math.min(maxHeight, 900)}px`;
      dialogContent.style.height = '100%';
      Object.assign(modalBody.style, {
        display: 'flex',
        flexDirection: 'column',
        flex: '1 1 auto',
        minHeight: '0',
        overflowY: 'hidden',
      });
      Object.assign(manualControls.style, {
        display: 'flex',
        flex: '1 1 auto',
        flexDirection: 'column',
        minHeight: '0',
      });
    }
    Object.assign(previewContainer.style, {
      position: 'relative',
      display: 'flex',
      flex: '1 1 auto',
      minHeight: `${MIN_PREVIEW_HEIGHT}px`,
      overflow: 'hidden',
      width: '100%',
    });
    if (!manualControls.hidden) {
      fitPreview();
    }
    drawSelection();
  }

  let relayoutFrame = 0;
  function scheduleRelayout() {
    cancelAnimationFrame(relayoutFrame);
    relayoutFrame = requestAnimationFrame(relayout);
  }
  window.addEventListener('resize', scheduleRelayout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleRelayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleRelayout);
  // Si algo del diálogo cambia de tamaño (aviso, mensajes de estado, cabecera, pie...), se recoloca el visor.
  // Solo se observan los demás elementos; el visor no, así que no hay bucles.
  if (typeof ResizeObserver !== 'undefined') {
    const layoutObserver = new ResizeObserver(scheduleRelayout);
    [
      dialogContent.querySelector('.modal-header'), dialogContent.querySelector('.modal-footer'),
      documentWarning, signatureFieldControl, $('previewControls'), manualControls.querySelector('p'), $('regionStatus'),
    ].forEach(element => { if (element) layoutObserver.observe(element); });
  }

  async function renderPreviewPage(number, clearRegion = true) {
    if (!previewDocument) return;
    currentPage = Math.max(1, Math.min(previewDocument.numPages, number));
    if (clearRegion) {
      selectedRegion = null;
      regionStatus.textContent = 'Aún no has seleccionado una región.';
    }
    pageNumberInput.value = String(currentPage);
    pageNumberInput.max = String(previewDocument.numPages);
    pageCount.textContent = `de ${previewDocument.numPages}`;
    const page = await previewDocument.getPage(currentPage);
    const viewport = page.getViewport({ scale: 1.4 });
    previewViewport = viewport;
    previewCanvas.width = viewport.width;
    previewCanvas.height = viewport.height;
    selectionCanvas.width = viewport.width;
    selectionCanvas.height = viewport.height;
    await page.render({ canvasContext: previewCanvas.getContext('2d'), viewport }).promise;
    page.cleanup();
    relayout();
  }

  function pdfRectangleFromSelection(region) {
    const { left, top, right, bottom } = region.viewportRect;
    const points = [
      previewViewport.convertToPdfPoint(left, top),
      previewViewport.convertToPdfPoint(left, bottom),
      previewViewport.convertToPdfPoint(right, top),
      previewViewport.convertToPdfPoint(right, bottom),
    ];
    return {
      lowerLeftX: Math.min(...points.map(point => point[0])),
      lowerLeftY: Math.min(...points.map(point => point[1])),
      upperRightX: Math.max(...points.map(point => point[0])),
      upperRightY: Math.max(...points.map(point => point[1])),
      page: region.page,
    };
  }

  async function openSignaturePreview() {
    if (typeof pdfjsLib === 'undefined') {
      throw new Error('No se pudo cargar el visor PDF. Comprueba la conexión e inténtalo de nuevo.');
    }
    disposePreview();
    const selectedFiles = Array.from(filesInput.files);
    for (let index = 0; index < selectedFiles.length; index++) {
      const file = selectedFiles[index];
      setStatus(`Revisando documento ${index + 1} de ${selectedFiles.length}: ${file.name}`);
      const bytes = new Uint8Array(await file.arrayBuffer());
      if (String.fromCharCode(...bytes.subarray(0, 4)) !== '%PDF') {
        throw new Error(`El archivo "${file.name}" no es un PDF válido.`);
      }
      try {
        const pdf = await inspectPdf(file, bytes, index === 0);
        pdfs.push(pdf);
        if (index === 0) previewDocument = pdf.document;
      } catch (error) {
        if (index === 0) throw new Error(`No se pudo previsualizar "${file.name}": ${error.message || error}`);
        pdfs.push({ file, bytes, layout: null, fields: [], document: null, inspectionError: error });
      }
    }

    while (signatureFieldSelect.options.length > 1) signatureFieldSelect.remove(1);
    const firstFields = pdfs[0].fields;
    for (let index = 0; index < firstFields.length; index++) {
      const option = document.createElement('option');
      option.value = `field:${index}`;
      option.textContent = `${firstFields[index].name} (página ${firstFields[index].page})`;
      signatureFieldSelect.appendChild(option);
    }
    signatureFieldSelect.value = 'manual';
    signatureFieldControl.hidden = firstFields.length === 0;
    manualControls.hidden = false;
    documentWarning.hidden = !hasDifferentDocuments();
    if (!documentWarning.hidden) {
      documentWarning.textContent =
        'Los documentos no tienen la misma estructura. Si continúa, se intentará aplicar en cada uno la ubicación elegida en el primero (campo de firma o página y región), siempre que sea compatible. Los documentos incompatibles no se firmarán y se incluirán en el ZIP con su nombre original.';
    }

    currentPage = 1;
    selectedRegion = null;
    confirmSignButton.textContent = documentWarning.hidden ? 'Firmar y descargar' : 'Continuar y firmar';
    openPreviewDialog();
    await renderPreviewPage(1);
    updateConfirmButton();
    setStatus('');
  }

  function getSelectedField() {
    if (!signatureFieldSelect.value.startsWith('field:')) return null;
    const index = Number(signatureFieldSelect.value.slice('field:'.length));
    return Number.isInteger(index) ? pdfs[0].fields[index] || null : null;
  }

  function buildFirmaParams(pdf, choice) {
    if (choice.field) {
      const field = pdf.fields.find(candidate => candidate.name === choice.field.name);
      if (!field) throw new Error(`No se encontró el campo de firma "${choice.field.name}".`);
      return [
        `signatureFieldName=${field.name.replace(/[\r\n]/g, ' ')}`,
        `signaturePages=${field.page}`,
      ].join('\n');
    }
    const pageLayout = pdf.layout && pdf.layout[choice.region.page - 1];
    if (!pageLayout) throw new Error(`El documento no tiene la página ${choice.region.page}.`);
    const [pageLeft, pageBottom, pageRight, pageTop] = pageLayout.view;
    const rect = choice.region;
    if (rect.lowerLeftX < pageLeft || rect.lowerLeftY < pageBottom ||
        rect.upperRightX > pageRight || rect.upperRightY > pageTop) {
      throw new Error(`La región seleccionada no cabe en la página ${choice.region.page}.`);
    }
    return [
      `signaturePositionOnPageLowerLeftX=${rect.lowerLeftX.toFixed(2)}`,
      `signaturePositionOnPageLowerLeftY=${rect.lowerLeftY.toFixed(2)}`,
      `signaturePositionOnPageUpperRightX=${rect.upperRightX.toFixed(2)}`,
      `signaturePositionOnPageUpperRightY=${rect.upperRightY.toFixed(2)}`,
      `signaturePages=${rect.page}`,
    ].join('\n');
  }

  function uniqueArchiveName(fileName, signed, usedNames) {
    const baseName = sanitizeFilename(fileName).replace(/\.pdf$/i, '') || 'archivo';
    const suffix = signed ? '_signed' : '';
    let name = `${baseName}${suffix}.pdf`;
    let counter = 2;
    while (usedNames.has(name.toLocaleLowerCase('es'))) {
      name = `${baseName}${suffix}_${counter++}.pdf`;
    }
    usedNames.add(name.toLocaleLowerCase('es'));
    return name;
  }

  async function signSelectedPdfs(choice) {
    try {
      if (typeof AutoScript === 'undefined' || typeof AutoScript.sign !== 'function' ||
          typeof AutoScript.cargarAppAfirma !== 'function' || typeof AutoScript.setStickySignatory !== 'function') {
        throw new Error('No se pudo cargar AutoScript. Comprueba la conexión o coloca autoscript.js junto a esta página.');
      }
      if (pdfs.length > 1 && typeof JSZip === 'undefined') {
        throw new Error('No se pudo cargar JSZip, necesario para descargar varios documentos.');
      }
      if (typeof AutoScript.setForceWSMode === 'function') AutoScript.setForceWSMode(false);
      AutoScript.cargarAppAfirma();
      AutoScript.setStickySignatory(true);

      const results = [];
      for (let index = 0; index < pdfs.length; index++) {
        const pdf = pdfs[index];
        setStatus(`Firmando ${index + 1} de ${pdfs.length}: ${pdf.file.name}`);
        try {
          if (pdf.inspectionError) throw new Error('No se pudo comprobar la estructura de sus páginas.');
          const firmaParams = buildFirmaParams(pdf, choice);
          const signedBase64 = await firmarPdf(uint8ArrayToBase64(pdf.bytes), firmaParams);
          if (!signedBase64) throw new Error('AutoFirma no devolvió el PDF firmado.');
          const signedBytes = base64ToUint8Array(signedBase64);
          if (String.fromCharCode(...signedBytes.subarray(0, 4)) !== '%PDF') {
            throw new Error('AutoFirma no devolvió un PDF firmado válido.');
          }
          results.push({ pdf, signedBytes });
        } catch (error) {
          console.error(`No se pudo firmar "${pdf.file.name}":`, error);
          results.push({ pdf, error });
        }
      }

      const successful = results.filter(result => result.signedBytes);
      const failed = results.filter(result => result.error);
      if (pdfs.length === 1) {
        if (failed.length) throw new Error(`No se pudo firmar "${pdfs[0].file.name}": ${failed[0].error.message}`);
        const name = uniquePdfName(pdfs[0].file.name, new Set());
        downloadBlob(new Blob([successful[0].signedBytes], { type: 'application/pdf' }), name);
        setStatus(`PDF firmado descargado: ${name}`);
        return;
      }

      const zip = new JSZip();
      const usedNames = new Set();
      for (const result of results) {
        const name = uniqueArchiveName(result.pdf.file.name, Boolean(result.signedBytes), usedNames);
        zip.file(name, result.signedBytes || result.pdf.bytes);
      }
      const blob = await zip.generateAsync({ type: 'blob' });
      downloadBlob(blob, 'documentos_firmados.zip');
      setStatus(
        `Firmados ${successful.length} de ${results.length} documentos. ZIP descargado.` +
        (failed.length ? ` Sin firmar (incluidos con su nombre original): ${failed.map(result => result.pdf.file.name).join(', ')}.` : ''),
        failed.length > 0
      );
    } finally {
      disposePreview();
      filesInput.disabled = false;
      signButton.disabled = filesInput.files.length === 0;
    }
  }

  filesInput.addEventListener('change', () => {
    const selectedFiles = Array.from(filesInput.files);
    const invalidFiles = selectedFiles.filter(file => !/\.pdf$/i.test(file.name));
    signButton.disabled = selectedFiles.length === 0 || invalidFiles.length > 0;
    setStatus(
      invalidFiles.length
        ? `Solo se admiten archivos PDF: ${invalidFiles.map(file => file.name).join(', ')}.`
        : selectedFiles.length ? `${selectedFiles.length} archivo(s) seleccionado(s).` : '',
      invalidFiles.length > 0
    );
  });

  signButton.addEventListener('click', async () => {
    const selectedFiles = Array.from(filesInput.files);
    if (!selectedFiles.length) return;
    if (selectedFiles.some(file => !/\.pdf$/i.test(file.name))) {
      setStatus('Solo se admiten archivos PDF.', true);
      return;
    }
    signButton.disabled = true;
    filesInput.disabled = true;
    setStatus(`Preparando la vista previa de ${selectedFiles.length} documento(s)…`);
    try {
      await openSignaturePreview();
    } catch (error) {
      console.error('Error al preparar la vista previa:', error);
      if (previewDialog.classList.contains('show')) closePreviewDialog();
      disposePreview();
      filesInput.disabled = false;
      signButton.disabled = filesInput.files.length === 0;
      setStatus(`Error: ${error.message || error}`, true);
    }
  });

  signatureFieldSelect.addEventListener('change', () => {
    manualControls.hidden = signatureFieldSelect.value !== 'manual';
    updateConfirmButton();
    relayout();
  });
  pageNumberInput.addEventListener('change', () => renderPreviewPage(Number(pageNumberInput.value) || 1));

  selectionCanvas.addEventListener('pointerdown', event => {
    if (manualControls.hidden || !previewViewport) return;
    const bounds = selectionCanvas.getBoundingClientRect();
    const x = Math.max(0, Math.min(previewViewport.width, (event.clientX - bounds.left) * previewViewport.width / bounds.width));
    const y = Math.max(0, Math.min(previewViewport.height, (event.clientY - bounds.top) * previewViewport.height / bounds.height));
    drawingRegion = { page: currentPage, viewportRect: { left: x, top: y, right: x, bottom: y } };
    selectionCanvas.setPointerCapture(event.pointerId);
    drawSelection();
  });
  selectionCanvas.addEventListener('pointermove', event => {
    if (!drawingRegion || !previewViewport) return;
    const bounds = selectionCanvas.getBoundingClientRect();
    const x = Math.max(0, Math.min(previewViewport.width, (event.clientX - bounds.left) * previewViewport.width / bounds.width));
    const y = Math.max(0, Math.min(previewViewport.height, (event.clientY - bounds.top) * previewViewport.height / bounds.height));
    drawingRegion.viewportRect.right = x;
    drawingRegion.viewportRect.bottom = y;
    drawSelection();
  });
  selectionCanvas.addEventListener('pointerup', event => {
    if (!drawingRegion) return;
    const { left, top, right, bottom } = drawingRegion.viewportRect;
    if (Math.abs(right - left) < 12 || Math.abs(bottom - top) < 12) {
      drawingRegion = null;
      regionStatus.textContent = 'La región es demasiado pequeña. Selecciona un rectángulo mayor.';
      drawSelection();
      updateConfirmButton();
      return;
    }
    selectedRegion = {
      page: currentPage,
      viewportRect: {
        left: Math.min(left, right),
        top: Math.min(top, bottom),
        right: Math.max(left, right),
        bottom: Math.max(top, bottom),
      },
    };
    drawingRegion = null;
    regionStatus.textContent = `Región seleccionada en la página ${currentPage}.`;
    drawSelection();
    updateConfirmButton();
    selectionCanvas.releasePointerCapture(event.pointerId);
  });

  $('cancelPreview').addEventListener('click', () => {
    cancelPreview();
  });
  confirmSignButton.addEventListener('click', async () => {
    const field = getSelectedField();
    if (!field && !selectedRegion) return;
    const choice = field ? { field } : { region: pdfRectangleFromSelection(selectedRegion) };
    closePreviewDialog();
    confirmSignButton.disabled = true;
    try {
      await signSelectedPdfs(choice);
    } catch (error) {
      console.error('Error al firmar los archivos:', error);
      disposePreview();
      filesInput.disabled = false;
      signButton.disabled = filesInput.files.length === 0;
      setStatus(`Error: ${error.message || error}`, true);
    }
  });
</script>
