<div>
  <h3>Datos del Anexo</h3>
  <div class="row">
    <div class="col-12 col-md-6">
      <div class="form-group">
        <label class="d-block" for="profesor">Profesor/a del módulo</label>
        <input type="text" id="profesor" class="form-control" style="width: 100%;">
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="form-group">
        <label class="d-block" for="grupo">Grupo</label>
        <input type="text" id="grupo" class="form-control" style="width: 100%;">
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="form-group">
        <label class="d-block" for="modulo">Módulo profesional</label>
        <input type="text" id="modulo" class="form-control" style="width: 100%;">
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="form-group">
        <label class="d-block" for="codigo">Código del módulo</label>
        <input type="text" id="codigo" class="form-control" style="width: 100%;">
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="form-group">
        <label class="d-block" for="ciclo">Ciclo formativo o Curso de especialización</label>
        <input type="text" id="ciclo" class="form-control" style="width: 100%;">
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="form-group">
        <label class="d-block" for="defaultItem">Valor por defecto de competencias de prevención</label>
        <select id="defaultItem" class="custom-select" style="width: 100%;">
          <option value="SI" selected>SÍ</option>
          <option value="NP">NO PROCEDE</option>
          <option value="">DEJAR EN BLANCO</option>
        </select>
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="form-group">
        <label class="d-block" for="curso_academico">Curso académico</label>
        <select id="curso_academico" class="custom-select" style="width: 100%;">
          <option value="Primero">Primero</option>
          <option value="Segundo">Segundo</option>
        </select>
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="form-group">
        <label class="d-block" for="anio_escolar">Año escolar</label>
        <select id="anio_escolar" class="custom-select" style="width: 100%;"></select>
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="form-group">
        <label class="d-block" for="lugar">Lugar</label>
        <input type="text" id="lugar" class="form-control" style="width: 100%;">
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="form-group">
        <label class="d-block" for="fecha">Fecha</label>
        <input type="date" id="fecha" class="form-control">
      </div>
    </div>
  </div>
</div>

<div id="pdfFieldset" style="display:none">
  <h3>Plantilla PDF (Anexo I)</h3>
  <p class="hint" id="pdfStatus"></p>
  <div id="pdfFallback" class="form-group" style="display:none;">
    <input type="file" id="pdfFile" accept="application/pdf">
  </div>
</div>

<div>
  <h3>Alumnos</h3>
  <div class="form-group">
    <input type="file" id="xlsxFile" accept=".xlsx,.xls,.csv">
  </div>
  <p class="hint">
    Descarga la plantilla con las columnas necesarias o añade los alumnos desde AulaVirtual en la opción
    <em>Participantes</em> → <em>Descargar datos de tabla como Microsoft Excel (.xlsx)</em>.
    <a href="#" id="tplAlumnos">Descargar plantilla</a>
  </p>
</div>

<div id="actionBar">
  <button id="generate" class="btn btn-primary" disabled>Generar ZIP</button>
  <button id="generateSigned" class="btn btn-primary" disabled>Generar ZIP firmados</button>
  <span id="status"></span>
</div>

function sanitizePart(s){
  return String(s || '')
    .normalize('NFC')
    .replace(/[,\s]+/g, '_')
    .replace(/[\\/:*?"<>|]/g, '')
    .replace(/_+/g, '_')
    .replace(/^_+|_+$/g, '');
}
function splitDate(dateStr){
  if (!dateStr) return null;
  const [y, m, d] = dateStr.split('-').map(Number);
  if (!y || !m || !d) return null;
  return { y, m, d };
}
const MESES = ['enero','febrero','marzo','abril','mayo','junio',
               'julio','agosto','septiembre','octubre','noviembre','diciembre'];

function base64ToUint8Array(b64){
  const clean = b64.replace(/\s+/g, '');
  const binary = atob(clean);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
function uint8ArrayToBase64(bytes){
  let binary = '';
  const len = bytes.byteLength;
  for (let i = 0; i < len; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

async function loadWidgets(){
  const pdfjsDoc = await pdfjsLib.getDocument({ data: templateBytes.slice() }).promise;
  const page = await pdfjsDoc.getPage(1);
  const anns = await page.getAnnotations();
  widgets = anns
    .filter(a => a.subtype === 'Widget')
    .map(a => ({
      fieldName: a.fieldName || '',
      rect: a.rect,
      kind: a.fieldType || '',
    }));
}

async function setTemplateFromBytes(bytes){
  const head = String.fromCharCode(...bytes.slice(0, 4));
  if (head !== '%PDF'){
    throw new Error('El contenido no es un PDF válido.');
  }
  templateBytes = bytes;
  await loadWidgets();
  $('pdfFieldset').style.display = 'none';
  $('pdfStatus').textContent = '';
  $('pdfFallback').style.display = 'none';
  updateGenerateButton();
}

async function initPdf(){
  if (PDF_BASE64 && PDF_BASE64.trim().length > 0){
    try {
      const bytes = base64ToUint8Array(PDF_BASE64);
      await setTemplateFromBytes(bytes);
      return;
    } catch(err){
      console.error('Error al decodificar el PDF embebido:', err);
      $('pdfFieldset').style.display = '';
      $('pdfStatus').textContent = 'Error al decodificar el PDF embebido: ' + err.message;
      $('pdfStatus').className = 'hint error';
      $('pdfFallback').style.display = '';
      updateGenerateButton();
      return;
    }
  }

  $('pdfFieldset').style.display = '';
  $('pdfStatus').textContent = 'Sube el PDF del Anexo I para empezar.';
  $('pdfStatus').className = 'hint';
  $('pdfFallback').style.display = '';
  updateGenerateButton();
}

// ---------------- eliminar widgets de casilla ----------------
function removeWidgetAnnotations(doc, predicate){
  let removed = 0;
  const pages = doc.getPages();
  const { PDFName } = PDFLib;

  for (const page of pages){
    const annotsObj = page.node.get(PDFName.of('Annots'));
    if (!annotsObj) continue;
    const annots = doc.context.lookup(annotsObj);
    if (!annots || typeof annots.size !== 'function') continue;

    for (let i = annots.size() - 1; i >= 0; i--){
      const ref = annots.get(i);
      const annot = doc.context.lookup(ref);
      if (!annot || typeof annot.get !== 'function') continue;

      const subtype = annot.get(PDFName.of('Subtype'));
      if (!subtype || subtype.toString() !== '/Widget') continue;

      const t = annot.get(PDFName.of('T'));
      let name = '';
      if (t){
        try {
          name = typeof t.decodeText === 'function' ? t.decodeText()
               : typeof t.asString   === 'function' ? t.asString()
               : String(t);
        } catch(e){ name = String(t); }
      }

      if (predicate(name)){
        annots.remove(i);
        removed++;
      }
    }
  }
  return removed;
}

// ---------------- carga del Excel ----------------
$('xlsxFile').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = await f.arrayBuffer();
    const wb = XLSX.read(data, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if (rows.length < 2) throw new Error('El Excel no tiene filas de datos.');
    const headers = rows[0].map(h => String(h).trim());
    const iN = headers.indexOf('Nombre');
    const iA = headers.indexOf('Apellido(s)');
    if (iN < 0) throw new Error('No se encuentra la columna "Nombre".');
    if (iA < 0) throw new Error('No se encuentra la columna "Apellido(s)".');

    const out = []; const seen = new Set();
    for (let i = 1; i < rows.length; i++){
      const r = rows[i] || [];
      const nombre = String(r[iN] || '').trim();
      const apellidos = String(r[iA] || '').trim();
      if (!nombre || !apellidos) continue;
      const key = (apellidos + '||' + nombre).toLocaleLowerCase('es');
      if (seen.has(key)) continue;
      seen.add(key);
      out.push({ nombre, apellidos });
    }
    students = out;
    $('status').textContent = `Cargados ${students.length} alumnos.`;
    $('status').className = '';
  } catch (err){
    console.error(err);
    students = [];
    $('status').textContent = 'Error al leer el Excel: ' + err.message;
    $('status').className = 'error';
  }
  updateGenerateButton();
});

function updateGenerateButton(){
  const ok = students.length > 0 && templateBytes && widgets.length > 0;
  $('generate').disabled = !ok;
  $('generateSigned').disabled = !ok || $('defaultItem').value === '';
  if (templateBytes && widgets.length === 0){
    $('status').textContent = 'El PDF no contiene widgets.';
    $('status').className = 'error';
  }
}

$('defaultItem').addEventListener('change', updateGenerateButton);

function downloadTemplate(){
  const workbook = XLSX.utils.book_new();
  const worksheet = XLSX.utils.aoa_to_sheet([
    ['Nombre', 'Apellido(s)'],
    ['Ana', 'Pérez Gómez'],
  ]);
  XLSX.utils.book_append_sheet(workbook, worksheet, 'Alumnos');
  XLSX.writeFile(workbook, 'plantilla_alumnos.xlsx');
}
$('tplAlumnos').addEventListener('click', event => {
  event.preventDefault();
  downloadTemplate();
});

// ---------------- valores ----------------
function textValue(role, data){
  const d = splitDate(data.fecha);
  if (role === 'dia')   return d ? String(d.d) : '';
  if (role === 'mes')   return d ? MESES[d.m - 1] : '';
  if (role === 'anio')  return d ? String(d.y) : '';
  return data[role] != null ? String(data[role]) : '';
}

async function fillOnePdf(student, removeEditableWidgets = false){
  const doc = await PDFLib.PDFDocument.load(templateBytes, { ignoreEncryption: true });
  const font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const fontBold = await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
  const black = PDFLib.rgb(0, 0, 0);

  const page = doc.getPage(0);

  const data = {
    profesor:        $('profesor').value.trim(),
    modulo:          $('modulo').value.trim(),
    codigo:          $('codigo').value.trim(),
    grupo:           $('grupo').value.trim(),
    ciclo:           $('ciclo').value.trim(),
    curso_academico: $('curso_academico').value,
    anio_escolar:    $('anio_escolar').value,
    lugar:           $('lugar').value.trim(),
    fecha:           $('fecha').value,
    defaultItem:     $('defaultItem').value,
    alumno_completo: `${student.apellidos}, ${student.nombre}`,
  };

  const removeAllEditableWidgets = removeEditableWidgets || data.defaultItem !== '';
  removeWidgetAnnotations(doc, name => {
    if (name === 'Signature15') return false;
    if (removeAllEditableWidgets) return true;
    const role = TEXT_MAP[name];
    return role !== undefined && Boolean(textValue(role, data));
  });

  for (const w of widgets){
    const [x1, y1, x2, y2] = w.rect;
    const width  = x2 - x1;
    const height = y2 - y1;

    if (w.fieldName in TEXT_MAP){
      const role  = TEXT_MAP[w.fieldName];
      const value = textValue(role, data);
      if (!value) continue;

      let size = Math.min(10, Math.max(6, height * 0.72));
      let textWidth = font.widthOfTextAtSize(value, size);
      while (textWidth > width - 2 && size > 5){
        size -= 0.5;
        textWidth = font.widthOfTextAtSize(value, size);
      }
      const capHeight = size * 0.7;
      page.drawText(value, {
        x: x1 + 1.5,
        y: y1 + (height - capHeight) / 2,
        size, font, color: black,
      });
      continue;
    }

    if (w.fieldName in CHECK_MAP){
      const [role, expected] = CHECK_MAP[w.fieldName];
      let mark = false;
      if (role === 'valor_pos') mark = data.defaultItem !== '';
      else if (role.startsWith('item')) mark = (data.defaultItem === expected);
      if (!mark) continue;

      const size = Math.min(width, height) * 0.85;
      const capHeight = size * 0.7;
      const xSize = fontBold.widthOfTextAtSize('X', size);
      page.drawText('X', {
        x: x1 + (width - xSize) / 2,
        y: y1 + (height - capHeight) / 2,
        size, font: fontBold, color: black,
      });
    }
  }

  return await doc.save();
}

// ---------------- generar ZIP ----------------
$('generate').addEventListener('click', async () => {
  try {
    $('generate').disabled = true;
    $('generateSigned').disabled = true;
    $('status').textContent = 'Generando…';
    $('status').className = '';

    const grupo = $('grupo').value.trim();
    const codigo = $('codigo').value.trim();
    if (!grupo || !codigo) throw new Error('Rellena al menos "Grupo" y "Código del módulo".');

    const zip = new JSZip();
    const folderName = `AnexoI_${sanitizePart(grupo)}_${sanitizePart(codigo)}`;
    const folder = zip.folder(folderName);
    const used = new Map();
    let ok = 0, fail = 0;

    for (const st of students){
      try {
        const ap = sanitizePart(st.apellidos);
        const no = sanitizePart(st.nombre);
        const baseName = `${sanitizePart(grupo)}_${ap}_${no}_${sanitizePart(codigo)}`;
        const n = used.get(baseName) || 0;
        const finalName = (n === 0 ? baseName : `${baseName}_${n + 1}`) + '.pdf';
        used.set(baseName, n + 1);

        const bytes = await fillOnePdf(st, $('defaultItem').value !== '');
        folder.file(finalName, bytes);
        ok++;
      } catch (err){
        console.error('Fallo con', st, err);
        fail++;
      }
    }

    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = folderName + '.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    $('status').textContent =
      `Generados ${ok} PDFs en ${folderName}.zip` + (fail ? ` (${fail} con error)` : '');
    $('status').className = '';
  } catch (err){
    console.error(err);
    $('status').textContent = 'Error: ' + err.message;
    $('status').className = 'error';
  } finally {
    updateGenerateButton();
  }
});

// ---------------- generar ZIP FIRMADOS ----------------
$('generateSigned').addEventListener('click', async () => {
  try {
    $('generate').disabled = true;
    $('generateSigned').disabled = true;
    $('status').textContent = 'Generando y firmando…';
    $('status').className = '';

    const grupo = $('grupo').value.trim();
    const codigo = $('codigo').value.trim();
    if (!grupo || !codigo) throw new Error('Rellena al menos "Grupo" y "Código del módulo".');

    // 1. Generar todos los PDFs en memoria y guardar sus nombres y bytes
    const pdfs = [];
    const used = new Map();
    for (const st of students){
      const ap = sanitizePart(st.apellidos);
      const no = sanitizePart(st.nombre);
      const baseName = `${sanitizePart(grupo)}_${ap}_${no}_${sanitizePart(codigo)}`;
      const n = used.get(baseName) || 0;
      const finalName = (n === 0 ? baseName : `${baseName}_${n + 1}`) + '.pdf';
      used.set(baseName, n + 1);

      const bytes = await fillOnePdf(st, true);
      pdfs.push({ name: finalName, bytes: bytes, signedBytes: null });
    }

    // 2. Comprobar que la librería AutoScript se ha cargado
    if (typeof AutoScript === 'undefined'){
      throw new Error('No se pudo cargar autoscript.js (ni desde el CDN ni localmente). Revisa la conexión o coloca autoscript.js junto a este HTML.');
    }
    // false = comunicación por WebSocket local (sin servlets). true forzaría servlets, que no tenemos.
    if (typeof AutoScript.setForceWSMode === 'function') AutoScript.setForceWSMode(false);
    // Inicializa el cliente y lanza AutoFirma (sin esto AutoScript.sign() falla con 'null')
    AutoScript.cargarAppAfirma();

    // 3. Firmar secuencialmente
    AutoScript.setStickySignatory(true); // Fijar certificado para todo el lote

    // Parámetros de firma visible: ajustados al recuadro de firma del Anexo I
    const firmaParams = [
      'signaturePositionOnPageLowerLeftX=252',
      'signaturePositionOnPageLowerLeftY=29',
      'signaturePositionOnPageUpperRightX=403',
      'signaturePositionOnPageUpperRightY=61',
      'signaturePages=1',
      'signatureReason=Firma del profesor',
      'signatureFieldName=FirmaProfesor'
    ].join('\n');

    let ok = 0, fail = 0;

    for (let i = 0; i < pdfs.length; i++){
      const pdf = pdfs[i];
      try {
        const base64Data = uint8ArrayToBase64(pdf.bytes);
        const signedBase64 = await firmarPdf(base64Data, firmaParams);
        pdf.signedBytes = base64ToUint8Array(signedBase64);
        ok++;
        $('status').textContent = `Firmando… (${i+1}/${pdfs.length})`;
      } catch (err){
        console.error('Error al firmar', pdf.name, err);
        if (i === 0 && ok === 0){
          throw new Error('No se pudo firmar con AutoFirma (¿instalado y abierto?). Detalle: ' + err.message);
        }
        fail++;
        pdf.signedBytes = null; // se incluirá sin firmar
      }
    }

    // 4. Empaquetar los PDFs firmados en un ZIP
    const zip = new JSZip();
    const folderName = `AnexoI_${sanitizePart(grupo)}_${sanitizePart(codigo)}_FIRMADOS`;
    const folder = zip.folder(folderName);

    for (const pdf of pdfs){
      const data = pdf.signedBytes || pdf.bytes; // si falló la firma, se incluye el original
      folder.file(pdf.name, data);
    }

    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = folderName + '.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    $('status').textContent =
      `Firmados ${ok} de ${pdfs.length} PDFs. ZIP: ${folderName}.zip` + (fail ? ` (${fail} con error)` : '');
    $('status').className = fail ? 'error' : '';
  } catch (err){
    console.error(err);
    $('status').textContent = 'Error: ' + err.message;
    $('status').className = 'error';
  } finally {
    updateGenerateButton();
  }
});

// ---------------- AutoFirma helpers ----------------

/**
 * Firma un PDF en Base64 con AutoFirma y devuelve el Base64 firmado.
 * Requiere haber llamado antes a AutoScript.cargarAppAfirma() (no admite callbacks).
 * El callback de error de AutoScript recibe (tipo, mensaje, codigo).
 */
function firmarPdf(base64Data, params){
  return new Promise((resolve, reject) => {
    try {
      AutoScript.sign(
        base64Data,
        'SHA256withRSA',
        'PAdES',
        params,
        (signatureB64) => resolve(signatureB64),
        (type, message, code) => reject(new Error(`${message || 'fallo al firmar'}${code ? ' [' + code + ']' : ''} (${type || 'Error'})`))
      );
    } catch(e){
      let t = '', m = '';
      try { t = AutoScript.getErrorType(); m = AutoScript.getErrorMessage(); } catch(_){}
      console.error('Excepción en AutoScript.sign:', e, '| tipo:', t, '| mensaje:', m);
      const det = (e && e.message && e.message !== 'Error') ? e.message : String(e);
      reject(new Error(`Excepción al firmar: ${det}` + (t || m ? ` [${t}] ${m}` : '')));
    }
  });
}
